name: Publish SDK to npm

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Optional git tag to checkout (e.g. sdk-v0.1.0). Leave empty to use the current ref."
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Check package version matches tag
        if: startsWith(github.ref, 'refs/tags/sdk-v')
        run: |
          TAG="${GITHUB_REF_NAME#sdk-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG_VERSION" ]; then
            echo "Tag sdk-v${TAG} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
