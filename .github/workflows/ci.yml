name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gateway
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache-dependency-path: packages/gateway/go.sum
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build -o /dev/null ./cmd/gateway

  go-sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/go-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: false
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: packages/sdk/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  playground:
    runs-on: ubuntu-latest
    needs: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/sdk/package-lock.json
            packages/playground/package-lock.json
      - name: Build SDK
        working-directory: packages/sdk
        run: npm ci && npm run build
      - name: Build playground
        working-directory: packages/playground
        run: npm ci && npx tsc --noEmit -p . && npm run build
