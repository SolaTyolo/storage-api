name: Publish gateway image to TCR

on:
  push:
    tags:
      - "gateway-v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-gateway-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ${{ vars.TCR_REGISTRY || 'ccr.ccs.tencentyun.com' }}
  NAMESPACE: ${{ vars.TCR_NAMESPACE || 'solat' }}
  IMAGE_NAME: ${{ vars.TCR_IMAGE_NAME || 'obj-gateway' }}
  GOLANG_IMAGE: ${{ vars.GOLANG_IMAGE || 'golang:1.25-alpine' }}
  ALPINE_IMAGE: ${{ vars.ALPINE_IMAGE || 'alpine:3.21' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Image metadata
        id: meta
        run: |
          IMAGE="${REGISTRY}/${NAMESPACE}/${IMAGE_NAME}"
          if [[ "${GITHUB_REF}" == refs/tags/gateway-v* ]]; then
            VERSION="${GITHUB_REF_NAME#gateway-v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest"
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAGS="${IMAGE}:latest"
          else
            echo "unsupported ref: ${GITHUB_REF}" >&2
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Tencent Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/gateway/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            TARGETPLATFORM=linux/amd64
            GOLANG_IMAGE=${{ env.GOLANG_IMAGE }}
            ALPINE_IMAGE=${{ env.ALPINE_IMAGE }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
