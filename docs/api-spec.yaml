openapi: 3.0.3
info:
  title: Obj Gateway API
  version: 0.3.0
  description: |
    Presigned URL gateway for S3-compatible object storage.

    All endpoints are `POST` with a JSON body (including read-only ones such as
    `/object/head` and `/object/list`). This keeps bucket/key/token out of URLs
    and access logs; responses are per-user and not meant to be HTTP-cached.

    Object keys must not start with `/`, must not contain empty, `.` or `..`
    path segments or control characters, and are at most 1024 bytes. A single
    trailing `/` is allowed (folder marker).

    Errors use `{"error": "<code>", "message": "<text>"}`; 5xx responses also
    include `requestId` (same as the `X-Request-Id` response header).
servers:
  - url: http://localhost:8080/api/v1
security:
  - bearerAuth: []
paths:
  /presign/put:
    post:
      summary: Presign PutObject upload URL
      description: |
        When `size` is sent it is signed as `Content-Length`, so storage rejects
        bodies of any other length. Buckets with `maxUploadBytes` require `size`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadUrl: { type: string }
                  cdnUrl: { type: string }
        "400": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "415": { $ref: "#/components/responses/Error" }
  /presign/get:
    post:
      summary: Presign GetObject download URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketKeyExpire"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  downloadUrl: { type: string }
  /multipart/create:
    post:
      summary: Create multipart upload
      description: |
        `size` (total object size) is required when the bucket sets
        `maxUploadBytes`; the assembled object is re-checked on complete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadId: { type: string }
  /multipart/presign-part:
    post:
      summary: Presign one upload part URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, key, uploadId, partNumber]
              properties:
                bucket: { type: string }
                key: { type: string }
                uploadId: { type: string }
                partNumber: { type: integer, minimum: 1, maximum: 10000 }
                expireSec: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  partUploadUrl: { type: string }
  /multipart/presign-parts:
    post:
      summary: Presign several upload part URLs in one call
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, key, uploadId, partNumbers]
              properties:
                bucket: { type: string }
                key: { type: string }
                uploadId: { type: string }
                partNumbers:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { type: integer, minimum: 1, maximum: 10000 }
                expireSec: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  parts:
                    type: array
                    items:
                      type: object
                      properties:
                        partNumber: { type: integer }
                        url: { type: string }
  /multipart/complete:
    post:
      summary: Complete multipart upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, key, uploadId, parts]
              properties:
                bucket: { type: string }
                key: { type: string }
                uploadId: { type: string }
                parts:
                  type: array
                  maxItems: 10000
                  items:
                    type: object
                    required: [partNumber, etag]
                    properties:
                      partNumber: { type: integer, minimum: 1, maximum: 10000 }
                      etag: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  etag: { type: string }
        "404": { $ref: "#/components/responses/Error" }
        "413":
          description: Assembled object exceeds the bucket maxUploadBytes and was deleted.
  /multipart/abort:
    post:
      summary: Abort multipart upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, key, uploadId]
              properties:
                bucket: { type: string }
                key: { type: string }
                uploadId: { type: string }
      responses:
        "200":
          description: OK
  /object/head:
    post:
      summary: Read object metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  size: { type: integer, format: int64 }
                  contentType: { type: string }
                  meta:
                    type: object
                    additionalProperties: { type: string }
                  etag: { type: string }
                  cdnUrl: { type: string }
        "404": { $ref: "#/components/responses/Error" }
  /object/list:
    post:
      summary: List objects (optional delimiter for folder view)
      description: |
        Authorization is checked against `prefix`; prefix-scoped tokens must
        list at or below a granted directory (e.g. `users/1/`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket]
              properties:
                bucket: { type: string }
                prefix: { type: string }
                delimiter: { type: string, description: "Use '/' for one-level listing" }
                continuationToken: { type: string }
                maxKeys: { type: integer, minimum: 0, maximum: 1000, description: "0 = 1000; larger values are capped" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        isDir: { type: boolean }
                        size: { type: integer, format: int64 }
                        etag: { type: string }
                        lastModified: { type: string, format: date-time }
                        cdnUrl: { type: string }
                  isTruncated: { type: boolean }
                  nextContinuationToken: { type: string }
  /object/delete:
    post:
      summary: Delete an object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BucketKey"
      responses:
        "200":
          description: OK
  /object/copy:
    post:
      summary: Server-side copy within a bucket
      description: Requires read access to `srcKey` and write access to `destKey`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucket, srcKey, destKey]
              properties:
                bucket: { type: string }
                srcKey: { type: string }
                destKey: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  cdnUrl: { type: string }
        "404": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256, `exp` required. Claims: `bucket` (optional single bucket),
        `allowedPrefixes` (directory prefixes; `users/1` grants `users/1/...`
        only), `scopes` (`read` / `write`; empty = both), `role`
        (`service_role` bypasses prefix and scope checks). `iss` / `aud` are
        enforced when JWT_ISSUER / JWT_AUDIENCE are configured.
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: forbidden }
        message: { type: string }
        requestId: { type: string }
    BucketKey:
      type: object
      required: [bucket, key]
      properties:
        bucket: { type: string }
        key: { type: string, maxLength: 1024 }
    BucketKeyExpire:
      allOf:
        - $ref: "#/components/schemas/BucketKey"
        - type: object
          properties:
            expireSec:
              type: integer
              minimum: 0
              description: "0 = DEFAULT_EXPIRE_SEC (900); must be <= MAX_EXPIRE_SEC (default 86400)"
    UploadRequest:
      allOf:
        - $ref: "#/components/schemas/BucketKeyExpire"
        - type: object
          properties:
            contentType: { type: string }
            meta:
              type: object
              additionalProperties: { type: string }
            size:
              type: integer
              format: int64
              minimum: 0
              description: Exact object size in bytes
