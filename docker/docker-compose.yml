services:
  rustfs:
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.0-beta.3}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # S3 API CORS (browser presigned PUT/GET from playground :5173). Console CORS is separate.
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: info
      RUSTFS_OBS_LOG_DIRECTORY: /var/log/rustfs/
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data
      - rustfs-logs:/var/log/rustfs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  rustfs-init:
    image: ${RC_IMAGE:-rustfs/rc:latest}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    depends_on:
      rustfs:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rc alias set local http://rustfs:9000 rustfsadmin rustfsadmin
        rc mb local/uploads || true
        # Dev only: anonymous read makes every object public (CDN + direct :9000),
        # so prefix/scope checks only guard writes and presigned GETs. Use a
        # separate private bucket without this policy for non-public data.
        rc anonymous set download local/uploads || true
        # RustFS rc expects { "rules": [{ allowedOrigins, ... }] } (not AWS CORSRules).
        cat > /tmp/cors.json <<'EOF'
        {
          "rules": [
            {
              "allowedOrigins": ["*"],
              "allowedMethods": ["GET", "PUT", "POST", "HEAD", "DELETE"],
              "allowedHeaders": ["*"],
              "exposeHeaders": ["ETag", "x-amz-request-id", "x-amz-id-2"],
              "maxAgeSeconds": 3600
            }
          ]
        }
        EOF
        rc cors set local/uploads /tmp/cors.json
        echo "rustfs-init done"

  gateway:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: docker/gateway/Dockerfile
      args:
        GOLANG_IMAGE: ${GOLANG_IMAGE:-golang:1.25-alpine}
        ALPINE_IMAGE: ${ALPINE_IMAGE:-alpine:3.21}
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        GOSUMDB: ${GOSUMDB:-sum.golang.org}
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: dev-secret-xxx
      LISTEN_ADDR: ":8080"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      # endpoint = in-docker; publicEndpoint = browser-facing host for presigned URLs
      BUCKET_CONFIG: >
        [{"name":"uploads","endpoint":"http://rustfs:9000","publicEndpoint":"http://localhost:9000","accessKey":"rustfsadmin","secretKey":"rustfsadmin","cdnDomain":"http://localhost:8081/uploads","useSSL":false,"region":"us-east-1"}]
    depends_on:
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully

  nginx:
    image: ${NGINX_IMAGE:-nginx:alpine}
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    ports:
      - "8081:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - rustfs

  playground:
    platform: ${DOCKER_PLATFORM:-linux/amd64}
    build:
      context: ..
      dockerfile: docker/playground/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:alpine}
        VITE_GATEWAY_ENDPOINT: http://localhost:8080/api/v1
        VITE_DEFAULT_BUCKET: uploads
        # Dev token signed with dev-secret-xxx: role=authenticated, bucket=uploads,
        # allowedPrefixes=["demo/"], scopes=["read","write"]. Browsers must never
        # receive service_role tokens; mint short-lived scoped tokens per user.
        VITE_GATEWAY_TOKEN: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJleHAiOjIxMDcxNzI2OTcsImlhdCI6MTc5MTgxMjY5Nywicm9sZSI6ImF1dGhlbnRpY2F0ZWQiLCJidWNrZXQiOiJ1cGxvYWRzIiwiYWxsb3dlZFByZWZpeGVzIjpbImRlbW8vIl0sInNjb3BlcyI6WyJyZWFkIiwid3JpdGUiXX0.Z9DYrQi0kczs_1H04DVY6bc5IJBw1IJ-Xyt1UAhrPpM
    ports:
      - "5173:80"
    depends_on:
      - gateway

volumes:
  rustfs-data:
  rustfs-logs:
